[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepfake-detector"
version = "2.0.0"
description = "Production-ready DeepFake detection using EfficientNet architecture"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["deepfake", "detection", "efficientnet", "computer-vision", "deep-learning"]
authors = [
    { name = "Umit Kacar", email = "umitkacar@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "opencv-python>=4.6.0",
    "facenet-pytorch>=2.5.0",
    "efficientnet-pytorch>=0.7.1",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "Pillow>=9.0.0",
    "albumentations>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "transformers>=4.20.0",
    "tqdm>=4.62.0",
    "PyYAML>=6.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-mock>=3.11.0",

    # Linting and formatting
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",

    # Type checking
    "mypy>=1.5.0",
    "types-PyYAML",
    "types-tqdm",

    # Pre-commit
    "pre-commit>=3.4.0",

    # Build tools
    "hatch>=1.7.0",
    "build>=0.10.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.22.0",
]

all = [
    "deepfake-detector[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/umitkacar/DeepFake-EfficientNet"
Documentation = "https://github.com/umitkacar/DeepFake-EfficientNet#readme"
Repository = "https://github.com/umitkacar/DeepFake-EfficientNet"
Issues = "https://github.com/umitkacar/DeepFake-EfficientNet/issues"

[project.scripts]
deepfake-extract = "scripts.extract_faces:main"
deepfake-train = "scripts.train:main"
deepfake-test = "scripts.test:main"
deepfake-inference = "scripts.inference:main"

# ===== HATCH CONFIGURATION =====

[tool.hatch.version]
path = "deepfake_detector/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["deepfake_detector"]

[tool.hatch.build.targets.sdist]
include = [
    "/deepfake_detector",
    "/scripts",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=deepfake_detector --cov-report=term-missing --cov-report=html {args:tests}"
cov = "pytest --cov=deepfake_detector --cov-report=term-missing {args:tests}"

# ===== RUFF CONFIGURATION =====

[tool.ruff]
target-version = "py38"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    "ANN", # flake8-annotations
    "SIM", # flake8-simplify
    "Q",   # flake8-quotes
]
ignore = [
    "E501",   # line too long (handled by black)
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "ANN401", # dynamically typed expressions (Any)
    "S301",   # pickle usage (we use torch.load which is similar)
    "S311",   # random usage
]

# Exclude directories
exclude = [
    ".git",
    ".hatch",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "checkpoints",
    "logs",
    "results",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["S101", "ANN"]  # assert usage, annotations

[tool.ruff.isort]
known-first-party = ["deepfake_detector"]

# ===== BLACK CONFIGURATION =====

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hatch
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | __pycache__
  | build
  | dist
  | checkpoints
  | logs
  | results
)/
'''

# ===== MYPY CONFIGURATION =====

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter checking
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "albumentations.*",
    "efficientnet_pytorch.*",
    "facenet_pytorch.*",
    "transformers.*",
    "sklearn.*",
    "scipy.*",
    "seaborn.*",
    "matplotlib.*",
    "tqdm.*",
]
ignore_missing_imports = true

# ===== PYTEST CONFIGURATION =====

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--color=yes",
    "--durations=10",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# ===== COVERAGE CONFIGURATION =====

[tool.coverage.run]
source = ["deepfake_detector"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/scripts/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ===== ISORT CONFIGURATION =====

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["deepfake_detector"]
skip_glob = [
    "**/.venv/*",
    "**/build/*",
    "**/dist/*",
]
